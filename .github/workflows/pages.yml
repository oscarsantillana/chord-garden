name: Deploy Rainbow Pitch to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Run fast regression suite
        shell: bash
        run: |
          set -euo pipefail
          tests=(
            tests/logic.test.mjs
            tests/chord-detect.test.mjs
            tests/chord-detect-all-chords.test.mjs
            tests/chord-detect-full-pool.test.mjs
            tests/chord-detect-live-resolution.test.mjs
            tests/fresh-chord-gate.test.mjs
            tests/chord-detect-sampled-piano.test.mjs
            tests/mic-capture.test.mjs
            tests/mic-capture-resolution.test.mjs
            tests/audio-output-barrier.test.mjs
            tests/real-piano-acceptance.test.mjs
            tests/real-piano-acceptance-browser.test.mjs
            tests/real-piano-acceptance-summary-cli.test.mjs
          )
          for test_file in "${tests[@]}"; do
            node "$test_file"
          done
          for script_file in js/*.js sw.js; do
            node --check "$script_file"
          done

      # Keep the operator-only acceptance harness outside the production
      # service-worker scope. The long 405-condition bass sweep remains a
      # manual release check until its test-only O(n²) DFT is replaced.
      - name: Prepare static site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          cp -R index.html sw.js assets css js _site/
          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
